# FERS+DRS init file: fers_w_drs.ini
[LogCollector.log]
EULOG_GUI_LOG_FILE_PATTERN = EULog_$4R_$12D.log

[Producer.my_fers0]
FERS_IP_ADDRESS = usb:62689
FERS_EXPECTED_PID = 62689
FERS_DEV_LOCK_PATH = /tmp/myfers0.lock
FERS_ID = "In the rack"
FERS_RO_MODE = 0
FERS_PRODID = "my_fers0"

[Producer.my_fers1]
# Second Citiroc/FERS board.
FERS_IP_ADDRESS = usb:22687
FERS_EXPECTED_PID = 22687
FERS_DEV_LOCK_PATH = /tmp/myfers1.lock
FERS_ID = "Second Citiroc"
FERS_RO_MODE = 0
FERS_PRODID = "my_fers1"

[Producer.my_drs0]
# DRS edit map:
#   DRS_ENABLED = 1 starts this producer from run_local_fers_w_drs.sh; 0 skips it.
#   DRS_LINK_TYPE = USB uses direct digitizer USB2. DRS_LINK_NUM is the USB link index.
#   DRS_LINK_TYPE = A4818 uses the USB3-to-CONET adapter. DRS_LINK_NUM is the A4818 PID,
#   and DRS_CONET_NODE is the daisy-chain node number.
DRS_BASE_ADDRESS = 0 # unused when DRS_CONF_FILE opens the board as direct USB
DRS_CONF_FILE = user/calvision/misc/conf/WaveDumpConfig_X742.txt
DRS_ENABLED = 1
DRS_LINK_TYPE = USB
DRS_LINK_NUM = 0
DRS_CONET_NODE = 0
DRS_BOARD_OFFSET = 0
DRS_EXPECTED_SERIAL = 251
DRS_DEV_LOCK_PATH = /tmp/mydrs0.lock
DRS_ID = "USB Digitizer"
DRS_PRODID = "my_drs0"

[Producer.my_drs1]
DRS_BASE_ADDRESS = 0 # unused when DRS_CONF_FILE opens the board as direct USB
DRS_CONF_FILE = user/calvision/misc/conf/WaveDumpConfig_X742.txt
DRS_ENABLED = 1
DRS_LINK_TYPE = USB
DRS_LINK_NUM = 1
DRS_CONET_NODE = 1
DRS_BOARD_OFFSET = 1
DRS_EXPECTED_SERIAL = 29622
DRS_DEV_LOCK_PATH = /tmp/mydrs1.lock
DRS_ID = "Second USB Digitizer"
DRS_PRODID = "my_drs1"

[Producer.my_drs2]
DRS_BASE_ADDRESS = 0 # unused when DRS_CONF_FILE opens the board as direct USB
DRS_CONF_FILE = user/calvision/misc/conf/WaveDumpConfig_X742.txt
DRS_ENABLED = 1
DRS_LINK_TYPE = USB
DRS_LINK_NUM = 2
DRS_CONET_NODE = 2
DRS_BOARD_OFFSET = 2
DRS_EXPECTED_SERIAL = 53365
DRS_DEV_LOCK_PATH = /tmp/mydrs2.lock
DRS_ID = "Third USB Digitizer"
DRS_PRODID = "my_drs2"

