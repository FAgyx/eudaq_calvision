# fers init file: fers.ini
[LogCollector.log]
EULOG_GUI_LOG_FILE_PATTERN = /mnt/mybook/MAXICC/CERNTB_Sept2025/data/raw/EULog_$12D.log

[Producer.my_fers0]
FERS_IP_ADDRESS = 172.16.0.11:tdl:0:0  # IP:tdl:0:0 
FERS_DEV_LOCK_PATH = /tmp/myfers0.lock
FERS_ID = "Front"
FERS_RO_MODE = 0
FERS_PRODID="my_fers0"

[Producer.my_drs0]
DRS_BASE_ADDRESS = 0 # unused when DRS_CONF_FILE opens the board as USB 0 0
DRS_CONF_FILE = user/calvision/misc/conf/WaveDumpConfig_X742.txt
DRS_DEV_LOCK_PATH = /tmp/mydrs0.lock
DRS_ID = "USB Digitizer"
DRS_PRODID="my_drs0"


